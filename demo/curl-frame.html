<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>curl frame</title>
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden}#viewer{width:100%;height:100%}</style>
</head>
<body>
<div id="viewer"></div>
<script type="module">
// Dev harness: always fetch the current module. A fixed cache-buster silently
// pins the page to whatever was published when that string was last changed.
const { default: MangaViewer } = await import('../src/manga-viewer.js?v=' + Date.now());
const q = new URLSearchParams(location.search);
const pages = Array.from({ length: 10 }, (_, i) =>
  `pages/page-${String(i + 1).padStart(3, '0')}.jpg`);
window.mv = new MangaViewer({
  container: '#viewer',
  pages,
  direction: q.get('dir') || 'rtl',
  pageTransition: q.get('t') || 'curl',
  firstPageSingle: true,
  title: 'curl harness',
  storageKey: 'curl_harness',
});
</script>
</body>
</html>
